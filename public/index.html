<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* テーマは初回ペイント前に確定させる（ちらつき防止）。設定値は auto|light|dark、
   data-theme には解決済みの light|dark だけを置く。 */
(function () {
  try {
    /* app.js の LS.set は JSON.stringify して書く。生の文字列として読むと "dark" が
       ダブルクォート込みになり一致しない。同じ読み方に揃える。 */
    var raw = localStorage.getItem('ytta.theme');
    var p = 'auto';
    try { p = raw == null ? 'auto' : JSON.parse(raw); } catch (e) { p = raw || 'auto'; }
    var dark = p === 'dark' || (p === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrendZap — YouTube trending rankings</title>
<meta name="description" content="Zap between everyone's YouTube ranking and your own. 24h / week / month / year / all time, videos and shorts, by country.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
<!-- media 無しの1枚。テーマを手動で切り替えたとき app.js がここを書き換える -->
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<a class="skip-link" href="#list" data-i18n="a11y.list">Ranking list</a>

<!-- ─────────────── app bar ─────────────── -->
<header class="appbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name" data-i18n="app.name">TrendZap</span>
  </div>
  <div class="appbar-actions">
    <!-- 4カ国を順に巡回するボタン。メニューは開かないので haspopup は付けない -->
    <button type="button" id="btn-country" class="iconbtn iconbtn-country">
      <span class="flag" id="country-flag" aria-hidden="true">🇯🇵</span><span class="country-code" id="country-code">JP</span>
    </button>
    <button type="button" id="btn-lang" class="iconbtn" data-i18n-aria="a11y.toggleLang" aria-label="Switch language"><span id="lang-code">EN</span></button>
    <button type="button" id="btn-settings" class="iconbtn" data-i18n-aria="a11y.openSettings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5A3.5 3.5 0 1 0 12 8.5M10.6 2h2.8l.5 2.3a8 8 0 0 1 1.7 1l2.2-.8 1.4 2.4-1.7 1.6a8 8 0 0 1 0 2l1.7 1.6-1.4 2.4-2.2-.8a8 8 0 0 1-1.7 1L13.4 22h-2.8l-.5-2.3a8 8 0 0 1-1.7-1l-2.2.8-1.4-2.4 1.7-1.6a8 8 0 0 1 0-2L4.8 8.9l1.4-2.4 2.2.8a8 8 0 0 1 1.7-1Z"/></svg>
    </button>
  </div>
</header>

<!-- ─────────────── みんな ⇄ 自分 ─────────────── -->
<nav class="modes" role="tablist" data-i18n-aria="a11y.modeTabs" aria-label="Ranking source">
  <button type="button" class="mode is-active" role="tab" data-mode="everyone" aria-selected="true"><span data-i18n="mode.everyone">Everyone</span></button>
  <button type="button" class="mode" role="tab" data-mode="my" aria-selected="false"><span data-i18n="mode.my">You</span></button>
  <button type="button" class="mode" role="tab" data-mode="tags" aria-selected="false"><span data-i18n="mode.tags">Words</span></button>
  <button type="button" class="mode" role="tab" data-mode="map" aria-selected="false"><span data-i18n="mode.map">World</span></button>
</nav>

<!-- ─────────────── みんな ─────────────── -->
<section class="view" id="view-everyone" data-view="everyone">
  <div class="axes">
    <div class="axis axis-periods" id="axis-periods" role="tablist" data-i18n-aria="a11y.periodTabs" aria-label="Time period"></div>
    <div class="axis-row">
      <div class="segmented" id="axis-sections" role="tablist" data-i18n-aria="a11y.sectionTabs" aria-label="Video type"></div>
      <div class="axis axis-categories" id="axis-categories" role="tablist" data-i18n-aria="a11y.categoryTabs" aria-label="Category"></div>
    </div>
    <div class="axis-row axis-row-metric" id="axis-metric-row" hidden>
      <div class="segmented segmented-metric" id="axis-metric" role="tablist"></div>
    </div>
    <!-- 絞り込み＋ピン留め。憲章「一覧性」を守るため1行に畳んでいる -->
    <div class="searchbar">
      <span class="search-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.45l4.25 4.25 1.4-1.4-4.25-4.25A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11a5.5 5.5 0 0 1 0-11"/></svg>
      </span>
      <input type="search" id="q" autocomplete="off" enterkeyhint="search"
             data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
      <button type="button" id="q-clear" class="q-clear" data-i18n-aria="search.clear" hidden>✕</button>
      <span id="favstar-slot"></span>
    </div>
    <!-- よく見るランキング（端末内のみ・自動＋手動ピン）。無い時は行ごと出さない -->
    <div class="favs" id="favs" hidden></div>
  </div>

  <p class="statusbar" id="statusbar" aria-live="polite"></p>

  <main class="list-wrap" id="list-wrap">
    <ol class="list" id="list" data-i18n-aria="a11y.list" aria-label="Ranking list"></ol>
  </main>
</section>

<!-- ─────────────── 自分（v2） ─────────────── -->
<section class="view" id="view-my" data-view="my" hidden>
  <div class="pane-head">
    <h1 class="pane-title" data-i18n="my.title">Your ranking</h1>
    <p class="pane-sub" data-i18n="my.subtitle"></p>
    <div class="pane-tools">
      <label class="switch"><input type="checkbox" id="my-enabled" checked><span class="switch-track" aria-hidden="true"></span><span class="switch-label" data-i18n="my.learning">Learning</span></label>
      <button type="button" class="btn btn-ghost" id="my-inspect" data-i18n="my.inspector.open">Show &amp; edit</button>
    </div>
  </div>
  <div class="inspector" id="my-inspector" hidden></div>
  <main class="list-wrap">
    <ol class="list" id="my-list"></ol>
  </main>
</section>

<!-- ─────────────── 検索（2026-08-25 発注者改訂: ワードタブを置き換え） ─────────────── -->
<section class="view" id="view-tags" data-view="tags" hidden>
  <div class="pane-head">
    <h1 class="pane-title" data-i18n="find.title">Search</h1>
    <p class="pane-sub" data-i18n="find.subtitle"></p>
  </div>
  <div class="axes find-axes">
    <div class="searchbar">
      <span class="search-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.45l4.25 4.25 1.4-1.4-4.25-4.25A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11a5.5 5.5 0 0 1 0-11"/></svg>
      </span>
      <input type="search" id="fq" autocomplete="off" enterkeyhint="search"
             data-i18n-placeholder="find.placeholder" data-i18n-aria="find.placeholder">
      <button type="button" id="fq-clear" class="q-clear" data-i18n-aria="search.clear" hidden>✕</button>
    </div>
    <div class="axis-row find-filters">
      <div class="axis axis-periods" id="find-periods" role="tablist" data-i18n-aria="find.scope.period"></div>
      <div class="segmented" id="find-sections" role="tablist" data-i18n-aria="find.scope.section"></div>
    </div>
  </div>
  <p class="statusbar" id="find-status" aria-live="polite"></p>
  <main class="list-wrap">
    <ol class="list" id="find-list"></ol>
    <div class="find-words" id="find-words"></div>
  </main>
</section>

<!-- ─────────────── 世界（v2） ─────────────── -->
<section class="view" id="view-map" data-view="map" hidden>
  <div class="pane-head">
    <h1 class="pane-title" data-i18n="map.title">World</h1>
    <p class="pane-sub" data-i18n="map.subtitle"></p>
  </div>
  <main class="map-wrap" id="map-wrap"></main>
</section>

<!-- ─────────────── footer ─────────────── -->
<footer class="foot">
  <p class="foot-line" data-i18n="app.thirdParty"></p>
  <p class="foot-line" data-i18n="app.attribution"></p>
  <p class="foot-links">
    <a href="privacy.html" data-i18n="settings.privacy">Privacy policy</a>
    <span aria-hidden="true">·</span>
    <a href="https://www.youtube.com/t/terms" rel="noopener noreferrer" target="_blank">YouTube Terms of Service</a>
    <span aria-hidden="true">·</span>
    <a href="https://policies.google.com/privacy" rel="noopener noreferrer" target="_blank">Google Privacy Policy</a>
  </p>
</footer>

<!-- ─────────────── settings sheet ─────────────── -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet-settings" role="dialog" aria-modal="true" data-i18n-aria="settings.title" aria-label="Settings" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <h2 class="sheet-title" data-i18n="settings.title">Settings</h2>
  <div class="sheet-body" id="sheet-body"></div>
  <button type="button" class="btn btn-primary btn-block" id="sheet-close" data-i18n="settings.close">Close</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
