# ============================================================================
# deploy.yml — コミット済みの public/ を GitHub Pages に公開する
#
# 何をするか:
#   main / master への push（public/ 配下が変わったとき）と、手動実行、
#   他ワークフローからの呼び出し（workflow_call）で、
#   リポジトリにコミットされている public/ をそのまま Pages に公開する。
#
# collect.yml との役割分担（重要）:
#   - collect.yml … 「たった今 API から集めたデータ」を公開する。
#     収集結果は ORDER §8 によりコミットしないので、同一ラン内で
#     upload-pages-artifact → deploy-pages まで完結させている。
#   - deploy.yml（このファイル）… 「コミット済みの内容」を公開する。
#     UI（index.html / app.js / app.css）の修正や、ゲートA 前のモックデータの公開、
#     Pages の設定変更後の再公開に使う。
#
#   ※ このワークフローは自前でチェックアウトするため、collect.yml から
#     workflow_call しても「収集直後のデータ」ではなく「コミット済みのモック」が
#     公開されてしまう。だから collect.yml はこれを呼ばない。
#   ※ workflow_call で呼ぶ場合、呼び出し元の GITHUB_TOKEN に pages: write と
#     id-token: write が無いと権限不足で失敗する（呼び出し先は呼び出し元より
#     強い権限を持てないため）。
#
# 満たす ORDER の条項:
#   §3 ホスティング＝GitHub Pages / ビルド工程なし（public/ をそのまま配信）
#   §6 P2「Actions定時実行＋Pages公開」
#   §8 公開するのは public/ だけ。API キーも state/ も成果物に含めない
#
# 前提: リポジトリの Settings → Pages → Source が「GitHub Actions」であること
#       （NEEDS_HUMAN.md のゲートE）。未設定なら configure-pages が明示的に失敗する。
# ============================================================================

name: deploy

on:
  push:
    # 既定ブランチ名の揺れに備えて両方を対象にする（ローカルの現行ブランチは master）。
    branches: [main, master]
    # UI や公開物に関係ない変更（docs/ の更新など）で毎回再公開しないための絞り込み。
    # 収集直後のデータを push で上書きしてしまう機会も、これで最小になる。
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# Pages の公開は同時に 1 本だけ。collect.yml の公開ジョブと同じグループ名にして、
# 「収集直後の公開」と「push によるモック再公開」が競合しないようにする。
# 進行中のデプロイは中断しない（中途半端な公開状態を避けるため）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 公開物を準備
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          persist-credentials: false # push できる認証情報を作業ツリーに残さない

      # ビルド工程は無い（ORDER §3）。public/ をそのまま成果物にする。
      # public/ の外（scripts/ state/ docs/ など）は一切含めない。
      # public/data は git に入れない（ORDER §8: 取得データを履歴に残さない）ので、
      # ここで用意しないと空のまま公開される。ただし **サンプルで実データを踏み潰さない**:
      #   1. collect.yml が保存したキャッシュから、いま公開中の集計結果を復元する
      #   2. それでも空だったとき（初回・ゲートA 未完了）だけサンプルを作る
      # これをしないと、UI の小さな修正を push するたびに実データがサンプルに戻る。
      - name: Node 20 を用意
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 公開中の public/data を復元
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: ytta-data-v1-restore-only
          restore-keys: |
            ytta-data-v1-

      - name: Python を用意（tools/mock.py 用）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: データが無ければサンプルを生成
        run: |
          set -eo pipefail
          if [ -f public/data/index.json ]; then
            echo "公開中のデータを復元しました（$(ls public/data | wc -l) ファイル）。サンプルは作りません。"
          else
            echo '::notice title=サンプルデータを生成します::キャッシュに公開中のデータがありませんでした。'
            python tools/mock.py
          fi

      # 保持期間は公開経路がどれであっても守る（ORDER §8）。
      - name: 保持期間の掃除（ORDER §8）
        run: node scripts/retention.mjs

      # Service Worker のキャッシュ名を公開のたびに変える。
      # ビルド工程が無い（ORDER §3）ので、成果物を作る直前にコミット SHA を差し込む。
      # これをしないと VERSION が 'v1' のまま固定され、一度キャッシュされたシェルが
      # 二度と更新されない（本番は cache-first のため）。
      - name: Service Worker の版をコミット SHA で刻む
        run: |
          set -eo pipefail
          sed -i "s/^const VERSION = '.*';/const VERSION = '${GITHUB_SHA:0:12}';/" public/sw.js
          grep -n "^const VERSION" public/sw.js

      - name: public/ を Pages 成果物にする
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Pages へ公開
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Pages へのデプロイ
      id-token: write # deploy-pages の OIDC 認証に必須
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages が「GitHub Actions」ソースで有効化されているかをここで確認する。
      # 未設定なら分かりやすく失敗する（NEEDS_HUMAN.md ゲートE へ誘導）。
      - name: Pages の設定を取得
        uses: actions/configure-pages@v5

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4

# (2026-08-25) ワークフローが gh workflow list に現れないため、再インデックスを促す無害な追記
